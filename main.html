<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0067A9" />
  <title>NCLEX RN — Question Selection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="assets/menu.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="icon-button" href="index.html" aria-label="Back to welcome screen" title="Back">
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </a>
      <div class="brand"><strong>NCLEX RN</strong><span>Question Selection</span></div>
      <button class="icon-button" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Dark mode">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <section class="dashboard-card" aria-labelledby="catalogTitle">
      <div class="dashboard-card-head">
        <div>
          <p class="eyebrow">Question Bank</p>
          <h1 id="catalogTitle">Final Assessment Tests</h1>
        </div>
        <button class="icon-button dashboard-reset" id="clearProgressBtn" type="button" aria-label="Clear saved progress" title="Clear progress">
          <span class="material-symbols-outlined">restart_alt</span>
        </button>
      </div>

      <section class="dashboard-section dashboard-top" aria-label="Question usage overview">
        <div class="dashboard-donut dashboard-donut-usage" id="usageRing" style="--used-angle:0deg;">
          <span><strong id="usagePercent">0%</strong><small>Usage</small></span>
        </div>
        <div class="dashboard-stat-list">
          <div class="dashboard-stat-row no-badge"><span class="dashboard-label">Total Questions</span><span class="dashboard-colon">:</span><strong class="dashboard-value" id="totalQuestions">0</strong></div>
          <div class="dashboard-stat-row"><span class="dashboard-label">Used Questions</span><span class="dashboard-colon">:</span><strong class="dashboard-value" id="usedQuestions">0</strong><span class="dashboard-badge badge-primary" id="usedPercent">0%</span></div>
          <div class="dashboard-stat-row"><span class="dashboard-label">Unused Questions</span><span class="dashboard-colon">:</span><strong class="dashboard-value" id="unusedQuestions">0</strong><span class="dashboard-badge badge-muted" id="unusedPercent">0%</span></div>
        </div>
      </section>

      <section class="dashboard-section dashboard-bottom" aria-label="Question result overview">
        <div class="dashboard-stat-list">
          <div class="dashboard-stat-row"><span class="dashboard-label">Total Correct</span><span class="dashboard-colon">:</span><strong class="dashboard-value" id="totalCorrect">0</strong><span class="dashboard-badge badge-correct" id="correctPercent">0%</span></div>
          <div class="dashboard-stat-row"><span class="dashboard-label">Total Incorrect</span><span class="dashboard-colon">:</span><strong class="dashboard-value" id="totalIncorrect">0</strong><span class="dashboard-badge badge-incorrect" id="incorrectPercent">0%</span></div>
          <div class="dashboard-stat-row"><span class="dashboard-label">Partially Incorr.</span><span class="dashboard-colon">:</span><strong class="dashboard-value" id="totalPartial">0</strong><span class="dashboard-badge badge-partial" id="partialPercent">0%</span></div>
        </div>
        <div class="dashboard-donut dashboard-donut-questions" id="resultRing" style="--correct-end:0deg;--incorrect-end:0deg;--partial-end:0deg;">
          <span><strong id="resultPercent">0%</strong><small>Correct</small></span>
        </div>
      </section>
    </section>

    <section class="catalog-section" aria-labelledby="availableTestsTitle">
      <div class="section-heading">
        <div><p class="eyebrow">Available Files</p><h2 id="availableTestsTitle">Select a test</h2></div>
        <span class="test-count" id="testCount">0 tests</span>
      </div>
      <div class="notice hidden" id="notice" role="status"></div>
      <div class="test-grid" id="testGrid"></div>
    </section>
  </main>

  <script src="assets/menu.js"></script>
</body>
</html>
